<!-- Navigation -->
<style>
.logo {
    height: 50px !important;
    vertical-align: middle;
}

.navbar-fixed-top {
    z-index: 99999 !important;
}

.lang-btn {
    height: 34px;
    padding: 0 12px;
    font-size: 12px;
    border: 1px solid Dodgerblue;
    background: transparent;
    color: Dodgerblue;
    border-radius: 4px;
    cursor: pointer;
}

/* --- Desktop View (> 768px) --- */
@media (min-width: 769px) {
    .logo {
        margin-right: 5px;
    }
    /* Keep header elements (Logo, Title, Lang button) on the left in LTR order */
    .navbar-header {
        float: left !important;
    }
    .navbar-brand {
        float: left !important;
        padding: 15px 15px !important;
    margin-top: -10px;
    }
    .lang-btn {
        float: left !important;
        margin: 13px 0 0 15px !important;
    }
    /* Shift nav links to the far right */
    .navbar-collapse {
        float: right !important;
    }
    .navbar-nav {
        float: right !important;
    }
}

/* --- Mobile View (<= 768px) --- */
@media (max-width: 768px) {
    .logo {
        margin-right: 5px;
    }
    .navbar-header {
        float: none !important;
        margin: 0 !important;
        padding: 5px 10px;
        overflow: hidden;
    }
    /* 1. Hamburger Toggle (Far Left) */
    .navbar-toggle {
        float: left !important;
        margin: 8px 10px 8px 5px !important;
    }
    /* 2. Brand / Logo (Directly next to Hamburger on Left) */
    .navbar-brand {
        float: left !important;
        padding: 5px 0 !important;
        height: 50px !important;
        line-height: 40px !important;
        font-size: 15px !important;
        margin: 0 !important;
    }
    /* 3. Language Button (Far Right) */
    .lang-btn {
        float: right !important;
        margin: 8px 0 8px 5px !important;
    }
    /* Centered Mobile Dropdown Links */
    .navbar-default .navbar-collapse {
        background-color: #222 !important;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center !important;
        clear: both !important;
        width: 100% !important;
        float: none !important;
        padding: 10px 0 !important;
    }
    .navbar-default .navbar-nav {
        margin: 0 !important;
        float: none !important;
        width: 100% !important;
    }
    .navbar-default .navbar-nav > li {
        float: none !important;
        display: block !important;
        text-align: center !important;
    }
    .navbar-default .navbar-nav > li > a {
        display: block !important;
        padding: 12px 15px !important;
        text-align: center !important;
    }
}
</style>

            <a class="navbar-brand page-scroll" style="color: Dodgerblue; font-family:'cairo',arial;" href="https://rawajitqan.com/en">
